name: Release

# Publish a GitHub release with a tag like v1.2.3. The workflow sets the version and
# download links in module.json, zips the module and attaches both files to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update module.json
        run: |
          jq --arg version "${{ steps.version.outputs.version }}" \
             --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
             --arg download "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.tmp.json
          mv module.tmp.json module.json

      # Kompendia wypełnia moduł w świecie, tylko treściami z włączonych podręczników.
      # Wydanie zawsze wysyła puste bazy, żeby lokalnie wygenerowane wpisy (także z oficjalnych
      # modułów) nigdy nie trafiły do module.zip, nawet gdy ktoś je przypadkiem zacommituje.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ship empty compendiums
        run: |
          rm -rf packs
          mkdir packs
          npm install --no-save --no-package-lock classic-level@1.4.1
          node --input-type=module -e '
            import { ClassicLevel } from "classic-level";
            for (const name of process.argv.slice(1)) {
              const db = new ClassicLevel(`packs/${name}`);
              await db.open();
              for await (const _ of db.keys()) throw new Error(`packs/${name} is not empty`);
              await db.close();
            }' $(jq -r '.packs[].name' module.json)
          ls -R packs

      - name: Build module.zip
        run: |
          zip -r module.zip . \
            -x ".git/*" ".github/*" ".gitignore" \
               "packs/*/LOCK" "packs/*/LOG" "packs/*/LOG.old" \
               "node_modules/*" "test/*" "docs/*" "tools/*" \
               "package.json" "package-lock.json"

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
